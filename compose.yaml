services:
  yada:
    build:
      context: .
      dockerfile: Dockerfile.slim
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - yada-scratch:/app/scratch
    environment:
      YADA_API_KEY: ${YADA_API_KEY:?set YADA_API_KEY in .env}
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).status==200 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  yada-scratch:
