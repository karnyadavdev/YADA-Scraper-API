[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yada-scraper-api"
version = "1.0.0"
description = "Layered FastAPI page-capture service"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[tool.setuptools]
packages = ["scraper"]
py-modules = ["yada_scraper"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["F"]
